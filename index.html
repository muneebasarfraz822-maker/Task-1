<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #1f2937;
            color: white;
            padding: 50px 20px;
        }

        main {
            padding: 50px 20px;
        }

        .card {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        footer {
            background-color: #1f2937;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>My First HTML Project on GitHub</p>
    </header>

    <main>
        <div class="card">
            <h2>About My Project</h2>
            <p>
                This is my first HTML project.
                I am learning Git, GitHub, Push and Pull.
            </p>

            <button>Learn More</button>
        </div>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
